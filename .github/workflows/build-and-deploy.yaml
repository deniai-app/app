name: Build and Deploy
on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        id: next-cache
        with:
          path: next-cache
          key: next-cache-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {"next-cache": "/app/.next/cache"}
          skip-extraction: ${{ steps.next-cache.outputs.cache-hit }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          # NEXT_PUBLIC_* are inlined at build time. They are public values, so they come
          # from repository variables. Server secrets stay out of the image (runtime env).
          build-args: |
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ vars.NEXT_PUBLIC_BETTER_AUTH_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_BILLING_DISABLED=${{ vars.NEXT_PUBLIC_BILLING_DISABLED }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Dokploy deploy
        run: |
          curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"push_data":{"tag":"latest"}}'
